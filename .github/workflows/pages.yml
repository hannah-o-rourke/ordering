name: Deploy order paper to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only the page. The Node server and the Apps Script source stay
      # in the repo but are not part of the site.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      # Turns Pages on for the repo if it is not already, so there is no
      # manual switch to flip in Settings before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
